name: Build trimmed OpenViking (bot only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenViking version to build (e.g. 0.3.22)'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(curl -s https://api.github.com/repos/volcengine/OpenViking/releases/latest \
              | jq -r .tag_name | sed 's/^v//')
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Checkout OpenViking source
        uses: actions/checkout@v4
        with:
          repository: volcengine/OpenViking
          ref: v${{ steps.ver.outputs.version }}
          fetch-depth: 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master

      - name: Cache cargo/uv/ccache
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo
            /root/.cache/uv
            /root/.ccache
          key: ${{ runner.os }}-openviking-${{ steps.ver.outputs.version }}-${{ hashFiles('Cargo.lock', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-openviking-${{ steps.ver.outputs.version }}-

      - name: Build and push trimmed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.trimmed
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENVIKING_VERSION=${{ steps.ver.outputs.version }}
            UV_LOCK_STRATEGY=locked
          platforms: linux/amd64

      - name: Output image digest
        run: |
          echo "Built: ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}"