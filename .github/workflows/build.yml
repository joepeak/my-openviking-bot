name: Build trimmed OpenViking (bot only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenViking version to build (e.g. 0.3.22)'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine & validate version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER=$(curl -s https://api.github.com/repos/volcengine/OpenViking/releases/latest | jq -r .tag_name | sed 's/^v//')
          fi
          if ! curl -sf "https://api.github.com/repos/volcengine/OpenViking/git/ref/tags/v$VER" >/dev/null; then
            echo "❌ Tag v$VER 不存在，请检查版本号"
            exit 1
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      # 1️⃣ 先 checkout 官方源码（构建上下文）
      - name: Checkout OpenViking source
        uses: actions/checkout@v4
        with:
          repository: volcengine/OpenViking
          ref: v${{ steps.ver.outputs.version }}
          fetch-depth: 1
          path: openviking

      # 2️⃣ 再 checkout 自己的仓库（拿 Dockerfile.trimmed），不写入 git 凭证
      - name: Checkout my repo (for Dockerfile.trimmed)
        uses: actions/checkout@v4
        with:
          path: my-repo
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master

      # 缓存放在两次 checkout 之后，确保 openviking 目录存在
      - name: Cache cargo/uv/ccache
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo
            /root/.cache/uv
            /root/.ccache
          key: ${{ runner.os }}-openviking-${{ steps.ver.outputs.version }}-${{ hashFiles('openviking/Cargo.lock', 'openviking/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-openviking-${{ steps.ver.outputs.version }}-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master

      - name: Build and push trimmed image
        uses: docker/build-push-action@v6
        with:
          context: openviking
          file: ../my-repo/Dockerfile.trimmed
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENVIKING_VERSION=${{ steps.ver.outputs.version }}
            UV_LOCK_STRATEGY=locked
          platforms: linux/amd64

      - name: Output image digest
        run: |
          echo "Built: ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}"
