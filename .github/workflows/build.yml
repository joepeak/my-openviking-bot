name: Build trimmed OpenViking (bot only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenViking version to build (e.g. 0.3.22)'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ─────────────────────────────────────────────
      # 1. 确定并校验版本号
      # ─────────────────────────────────────────────
      - name: Determine & validate version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/volcengine/OpenViking/releases/latest \
              | jq -r .tag_name | sed 's/^v//')
          fi
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "❌ 无法确定版本号（未提供输入且无法获取 latest release）"
            exit 1
          fi
          if ! curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/volcengine/OpenViking/git/ref/tags/v$VER" >/dev/null; then
            echo "❌ Tag v$VER 不存在，请检查版本号"
            exit 1
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "✅ 将构建版本 v$VER"

      # ─────────────────────────────────────────────
      # 2. checkout 官方源码（作为构建上下文）
      # ─────────────────────────────────────────────
      - name: Checkout OpenViking source
        uses: actions/checkout@v4
        with:
          repository: volcengine/OpenViking
          ref: v${{ steps.ver.outputs.version }}
          fetch-depth: 1
          path: openviking

      # ─────────────────────────────────────────────
      # 3. checkout 自己的仓库（拿 Dockerfile.trimmed）
      # ─────────────────────────────────────────────
      - name: Checkout my repo (for Dockerfile.trimmed)
        uses: actions/checkout@v4
        with:
          path: my-repo
          persist-credentials: false

      # ─────────────────────────────────────────────
      # 4. 拷贝 Dockerfile.trimmed 进构建上下文 + 硬校验
      # ─────────────────────────────────────────────
      - name: Copy Dockerfile into build context
        run: |
          set -euxo pipefail
          pwd
          echo "--- workspace root ---"
          ls -la

          echo "--- my-repo ---"
          ls -la my-repo/

          echo "--- source: 类型 + 大小 + 前 3 行 ---"
          stat my-repo/Dockerfile.trimmed
          wc -c my-repo/Dockerfile.trimmed
          head -3 my-repo/Dockerfile.trimmed

          echo "--- copy ---"
          cp -v my-repo/Dockerfile.trimmed openviking/Dockerfile.trimmed

          echo "--- dest: 类型 + 大小 + 前 3 行 ---"
          stat openviking/Dockerfile.trimmed
          wc -c openviking/Dockerfile.trimmed
          head -3 openviking/Dockerfile.trimmed

          echo "--- 是否为符号链接？ ---"
          if [ -L openviking/Dockerfile.trimmed ]; then
            echo "❌ 是符号链接！指向："
            readlink -f openviking/Dockerfile.trimmed
          else
            echo "✅ 不是符号链接"
          fi

      # ─────────────────────────────────────────────
      # 5. 登录 GHCR
      # ─────────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # 6. 设置 Buildx（用一次性 builder，避免复用旧状态）
      # ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: fresh-builder-${{ github.run_id }}
          driver: docker-container

      # ─────────────────────────────────────────────
      # 7. 构建并推送镜像
      #    注意 file 用 ./openviking/Dockerfile.trimmed
      #    带 ./ 前缀可避开 buildx 路径二次拼接的坑
      # ─────────────────────────────────────────────
      - name: Build and push trimmed image
        uses: docker/build-push-action@v6
        with:
          context: openviking
          file: ./openviking/Dockerfile.trimmed
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/my-openviking-bot:latest
          build-args: |
            OPENVIKING_VERSION=${{ steps.ver.outputs.version }}
            UV_LOCK_STRATEGY=auto
          platforms: linux/amd64

      # ─────────────────────────────────────────────
      # 8. 输出结果
      # ─────────────────────────────────────────────
      - name: Output image digest
        run: |
          echo "✅ Built: ghcr.io/${{ github.repository_owner }}/my-openviking-bot:${{ steps.ver.outputs.version }}"
          echo "✅ Built: ghcr.io/${{ github.repository_owner }}/my-openviking-bot:latest"
